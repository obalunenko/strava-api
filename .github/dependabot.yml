version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directories:
      - "/tools/*"
    schedule:
      interval: "daily"
    # go.mod marks tool modules as indirect, so list them by name: this bumps
    # the tools and leaves their own dependencies alone.
    allow:
      - dependency-name: "github.com/go-swagger/go-swagger"
      - dependency-name: "golang.org/x/tools"
    groups:
      tools:
        patterns:
          - "*"
    labels:
      - "dependencies"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"
